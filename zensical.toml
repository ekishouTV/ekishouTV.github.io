[project]
site_name = "ekishouTV's site"
site_url = "https://ekishoutv.github.io/"
theme = {
    palette = [
        {
            media = "(prefers-color-scheme)",
            toggle.icon = "lucide/sun-moon",
            toggle.name = "Switch to light mode",
        },
        {
            media = "(prefers-color-scheme: light)",
            scheme = "default",
            toggle.icon = "lucide/sun",
            toggle.name = "Switch to dark mode",
            primary = "light green",
            accent = "green",
        },
        {
            media = "(prefers-color-scheme: dark)",
            scheme = "slate",
            toggle.icon = "lucide/moon",
            toggle.name = "Switch to system preference",
            primary = "green",
            accent = "light green",
        },
    ],
    font = {
        text = "Zen Kaku Gothic Antique",
        code = "JetBrains Mono",
    },
    features = [
        "navigation.top",
        "navigation.footer",
        "navigation.tabs",
        "navigation.sections",
        "navigation.indexes",
    ],
}
plugins = [
  "search",
  "blog",
  "social",
  "glightbox",
]
markdown_extensions = {
    pymdownx = {
        highlight = {
            anchor_linenums = true,
        },
        superfences = {},
        details = {},
    },
    attr_list = {},
    admonition = {},
    md_in_html = {},
}
